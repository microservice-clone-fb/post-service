server:
  port: 5004
  servlet:
    context-path: /post

spring:
  application:
    name: post-service
  data:
    mongodb:
      uri: mongodb://localhost:30000/clone-fb-post-service?authSource=admin
      auto-index-creation: false
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true

# Tắt MongoDB Auditing để tránh override audit fields khi seed data
# Có thể bật lại sau khi seed xong
auditing:
  enabled: false

app:
  services:
    profile:
      url: http://localhost:5002/profile
